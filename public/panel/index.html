<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/panel/styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-1" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-2" aria-hidden="true"></div>
    <header class="topbar">
      <div>
        <p class="eyebrow">Discord Bot Multi Guild</p>
        <h1>Guild Setup Dashboard</h1>
      </div>
      <div class="token-box">
        <label for="tokenInput">Panel Token</label>
        <input id="tokenInput" type="password" placeholder="X-Panel-Token" />
        <button id="saveTokenBtn" type="button">Save</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel guild-list-panel">
        <div class="section-header">
          <h2>Guilds</h2>
          <button id="refreshGuildsBtn" type="button">Refresh</button>
        </div>
        <div id="guildList" class="guild-list"></div>
      </section>

      <section class="panel detail-panel">
        <div class="section-header">
          <h2 id="detailTitle">Select a guild</h2>
          <span id="statusBadge" class="badge">Idle</span>
        </div>

        <div id="metaGrid" class="meta-grid"></div>

        <form id="configForm" class="config-form">
          <div class="field-grid">
            <label>Employee Role ID <input name="employeeRoleId" required /></label>
            <label>Manager Role IDs (comma) <input name="managerRoleIdsRaw" required /></label>
            <label>CV Channel ID <input name="cvChannelId" required /></label>
            <label>Approved CV Channel ID <input name="cvApprovedChannelId" required /></label>
            <label>Timesheet Channel ID <input name="timesheetChannelId" required /></label>
            <label>Timesheet Archive Channel ID <input name="timesheetArchiveChannelId" required /></label>
            <label>Timesheet Summary Channel ID <input name="timesheetSummaryChannelId" required /></label>
            <label>Log Channel ID <input name="logChannelId" required /></label>
            <label>Timezone <input name="timezone" required placeholder="Europe/Bucharest" /></label>
          </div>

          <div class="actions">
            <button id="saveConfigBtn" type="submit">Save Config</button>
            <button id="provisionBtn" type="button" class="accent">Provision Tenant</button>
          </div>
        </form>

        <section class="audit-section">
          <h3>Recent Setup Audit</h3>
          <div id="auditList" class="audit-list"></div>
        </section>
      </section>
    </main>

    <template id="guildItemTemplate">
      <button class="guild-item" type="button">
        <div>
          <strong class="guild-name"></strong>
          <p class="guild-sub"></p>
        </div>
        <span class="guild-pill"></span>
      </button>
    </template>

    <script src="/panel/app.js" type="module"></script>
  </body>
</html>
